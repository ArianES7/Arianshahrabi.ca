{{ define "main" }}
  <section class="contact-page">
    <div class="contact-content">
      <p class="contact-prompt">Feel free to reach out</p>

      <div class="contact-methods">
        <span class="contact-email">{{ .Site.Params.Author.email }}</span>
        <div class="contact-socials" aria-label="Social links">
          {{ partialCached "author-links.html" . }}
        </div>
      </div>
    </div>

    <p class="contact-copyright">&copy; {{ now.Format "2006" }} {{ .Site.Params.Author.name }}</p>
  </section>
{{ end }}
