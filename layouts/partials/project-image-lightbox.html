<dialog
  id="project-image-lightbox"
  class="project-image-lightbox"
  aria-labelledby="project-image-lightbox-title"
  aria-describedby="project-image-lightbox-caption">
  <div class="project-image-lightbox-content">
    <button class="project-image-lightbox-close" type="button" aria-label="Close expanded image">
      Close
    </button>
    <h2 id="project-image-lightbox-title" class="sr-only">Expanded project image</h2>
    <div class="project-image-lightbox-stage" aria-busy="false">
      <p class="project-image-lightbox-status" role="status" aria-live="polite" hidden></p>
    </div>
    <p id="project-image-lightbox-caption"></p>
  </div>
</dialog>

<script>
  (() => {
    const dialog = document.getElementById('project-image-lightbox');
    if (!dialog) return;

    const caption = document.getElementById('project-image-lightbox-caption');
    const closeButton = dialog.querySelector('.project-image-lightbox-close');
    const stage = dialog.querySelector('.project-image-lightbox-stage');
    const status = dialog.querySelector('.project-image-lightbox-status');
    let returnFocus = null;
    let image = null;
    let requestId = 0;

    const resetImage = () => {
      requestId += 1;
      image?.remove();
      image = null;
      status.hidden = true;
      status.textContent = '';
      stage.setAttribute('aria-busy', 'false');
    };

    const close = () => {
      if (typeof dialog.close === 'function' && dialog.open) {
        dialog.close();
      } else {
        dialog.removeAttribute('open');
        resetImage();
        returnFocus?.focus();
        returnFocus = null;
      }
    };

    const open = (trigger) => {
      const source = trigger.querySelector('img');
      if (!source) return;

      const figure = trigger.closest('figure');
      const figureCaption = figure?.querySelector('figcaption')?.textContent?.trim();
      const sourceUrl = trigger.dataset.fullSrc || source.currentSrc || source.src;
      const currentRequest = ++requestId;
      returnFocus = trigger;
      caption.textContent = figureCaption || source.alt;
      image?.remove();
      image = null;
      status.textContent = 'Loading image';
      status.hidden = false;
      stage.setAttribute('aria-busy', 'true');

      if (typeof dialog.showModal === 'function') {
        dialog.showModal();
      } else {
        dialog.setAttribute('open', '');
      }
      closeButton.focus();

      const pendingImage = new Image();
      pendingImage.className = 'nozoom';
      pendingImage.decoding = 'async';
      pendingImage.alt = source.alt;
      pendingImage.src = sourceUrl;

      const ready = typeof pendingImage.decode === 'function'
        ? pendingImage.decode()
        : new Promise((resolve, reject) => {
            pendingImage.addEventListener('load', resolve, { once: true });
            pendingImage.addEventListener('error', reject, { once: true });
          });

      ready.then(() => {
        if (currentRequest !== requestId) return;
        image = pendingImage;
        stage.prepend(image);
        status.hidden = true;
        status.textContent = '';
        stage.setAttribute('aria-busy', 'false');
      }).catch(() => {
        if (currentRequest !== requestId) return;
        status.textContent = 'The image could not be loaded.';
        status.hidden = false;
        stage.setAttribute('aria-busy', 'false');
      });
    };

    document.querySelectorAll('[data-project-lightbox]').forEach((trigger) => {
      trigger.setAttribute('aria-haspopup', 'dialog');
    });

    document.addEventListener('click', (event) => {
      const trigger = event.target.closest('[data-project-lightbox]');
      if (!trigger) return;
      event.preventDefault();
      open(trigger);
    });

    closeButton.addEventListener('click', close);
    dialog.addEventListener('click', (event) => {
      if (event.target === dialog) close();
    });
    dialog.addEventListener('close', () => {
      resetImage();
      returnFocus?.focus();
      returnFocus = null;
    });
  })();
</script>
