<div
  id="search-wrapper"
  class="invisible fixed inset-0 flex h-screen w-screen cursor-default flex-col bg-neutral-500/50 p-4 backdrop-blur-sm dark:bg-neutral-900/50 sm:p-6 md:p-[10vh] lg:p-[12vh] z-500"
  data-url="{{ "" | absLangURL }}"
  aria-hidden="true">
  <div
    id="search-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="search-dialog-title"
    class="flex flex-col w-full max-w-3xl min-h-0 mx-auto border rounded-md shadow-lg top-20 border-neutral-200 bg-neutral dark:border-neutral-700 dark:bg-neutral-800">
    <h2 id="search-dialog-title" class="sr-only">Search this site</h2>
    <header class="relative z-10 flex items-center justify-between flex-none px-2">
      <form class="flex items-center flex-auto min-w-0" role="search">
        <div class="flex items-center justify-center w-8 h-8 text-neutral-500 dark:text-neutral-400" aria-hidden="true">
          {{ partial "icon.html" "search" }}
        </div>
        <label for="search-query" class="sr-only">Search projects and pages</label>
        <input
          type="search"
          id="search-query"
          class="flex flex-auto h-12 mx-1 bg-transparent appearance-none focus:outline-dotted focus:outline-2 focus:outline-transparent"
          placeholder="{{ i18n "search.input_placeholder" }}"
          autocomplete="off"
          tabindex="0">
      </form>
      <button
        id="close-search-button"
        type="button"
        class="flex min-h-11 min-w-11 items-center justify-center text-neutral-700 hover:text-primary-600 dark:text-neutral dark:hover:text-primary-400"
        aria-label="{{ i18n "search.close_button_title" }}"
        title="{{ i18n "search.close_button_title" }}">
        {{ partial "icon.html" "xmark" }}
      </button>
    </header>
    <section class="flex-auto px-2 overflow-auto" aria-live="polite">
      <p id="search-status" class="px-3 py-2 text-sm" hidden></p>
      <button id="search-retry" type="button" class="min-h-11 px-3 py-2 text-sm underline" hidden>Try again</button>
      <ul id="search-results"></ul>
    </section>
  </div>
</div>
